name: Deploy Next.js Portfolio to VPS

on:
  push:
    branches:
      - main # O la rama que utilices por defecto

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar al VPS y Desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          # command_timeout por defecto = 10m. El build en el VPS (Tesseract por
          # apt + pip + next build) puede pasarse de ahí y hacer que la ACCIÓN
          # reporte un falso fallo aunque el deploy termine bien en el servidor.
          # 30m da margen de sobra (y la capa de Tesseract queda cacheada, así
          # que los próximos builds son mucho más rápidos).
          command_timeout: 30m
          script: |
            cd /opt/apps/portafolio

            # Forzamos la sincronización exacta con tu repositorio en GitHub.
            # `--hard` solo toca archivos rastreados por git: tu .env
            # (nunca commiteado) queda intacto.
            git fetch --all
            git reset --hard origin/main

            # Reconstruimos y recreamos SOLO el contenedor de la app.
            # Antes: `docker compose down` (mataba TODO, incluyendo Postgres,
            # antes de confirmar que el build nuevo funciona — si el build
            # fallaba, el sitio quedaba caído sin red de seguridad).
            # Ahora: `up --build --force-recreate` reconstruye y reemplaza
            # el contenedor viejo por el nuevo directamente, sin apagar nada
            # primero. Si el build falla, el contenedor viejo (que sí
            # funciona) sigue sirviendo tráfico mientras se investiga.
            # Además, no reiniciamos portfolio-db en cada deploy — no hay
            # motivo, no cambió nada ahí.
            # --wait: espera a que los contenedores estén healthy antes de dar
            # el deploy por bueno. sentra-api corre las migraciones en su
            # entrypoint; si fallan, el healthcheck no pasa y ESTE step falla
            # (te enteras), en vez de quedar en un loop de reinicios silencioso.
            docker compose up -d --build --force-recreate --wait portfolio-app sentra-api sentra-redis

            # Limpieza automática de imágenes viejas para no llenar el disco de 50GB
            docker image prune -f