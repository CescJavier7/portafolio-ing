services:
  portfolio-app:
    build: .
    container_name: portfolio-frontend
    restart: always
    security_opt:
      - no-new-privileges:true
    # env_file carga TODAS las variables del archivo .env dentro del
    # contenedor en runtime (GROQ_API_KEY, y las de Postgres de abajo).
    # Este archivo vive SOLO en el VPS, nunca en el repo (mismo principio
    # que .env.local en tu Mac: secretos fuera de git).
    env_file:
      - .env
    environment:
      # Compose interpola ${...} leyendo el mismo .env automáticamente.
      # `portfolio-db` es resoluble por DNS interno de Docker gracias a
      # que ambos servicios comparten `internal-net`.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@portfolio-db:5432/${POSTGRES_DB}
      - NODE_ENV=production
      # Validación server-side de tokens de Sentra (chat identificado) por
      # la red interna de Docker: sin salir a internet ni pasar por Cloudflare.
      - SENTRA_API_INTERNAL_URL=http://sentra-api:8000
    depends_on:
      portfolio-db:
        condition: service_healthy
    networks:
      - proxy-net # Para que Traefik lo enrute desde afuera
      - internal-net # Para hablar con Postgres, sin exponerlo a internet
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.portfolio.rule=Host(`cescjavier.dev`) || Host(`www.cescjavier.dev`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      # 🔴 Eliminamos certresolver y forzamos TLS básico para que Cloudflare haga el trabajo
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.services.portfolio.loadbalancer.server.port=3000"

  portfolio-db:
    image: postgres:16-alpine
    container_name: portfolio-db
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432" # <-- EL PARCHE ATÓMICO: Abre el puerto SOLO para tu Mac
    volumes:
      # Persistencia real: los datos sobreviven a `docker-compose down` y
      # a rebuilds del contenedor. Solo se pierden si borras el volumen
      # explícitamente (`docker volume rm`).
      - postgres-data:/var/lib/postgresql/data
    networks:
      # SIN proxy-net a propósito: Postgres nunca debe ser alcanzable
      # desde Traefik ni desde internet, solo desde portfolio-app.
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  sentra-redis:
    image: redis:alpine
    container_name: sentra-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      # Sin proxy-net: Redis solo lo habla sentra-api, nunca internet.
      - internal-net

  sentra-api:
    build:
      context: ./services/api
    container_name: sentra-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # services/api/.env vive SOLO en el VPS (igual que el .env de la raíz):
    # secretos de Lemon Squeezy, JWT_SECRET, etc. Nunca en git.
    env_file:
      - ./services/api/.env
    environment:
      # OJO: DATABASE_URL ya NO se arma aquí por interpolación. La contraseña
      # de Postgres contiene caracteres especiales (@) que, insertados crudos
      # en una URL, rompen el parseo (el host queda mal y asyncpg tira
      # "Name or service not known"). DATABASE_URL vive en services/api/.env
      # con la contraseña URL-encodeada (@ -> %40), apuntando a
      # postgresql+asyncpg://...@portfolio-db:5432/sentra — misma base
      # Postgres que portfolio-db, base `sentra` separada (crearla una vez
      # a mano, ver README de services/api).
      - REDIS_URL=redis://sentra-redis:6379/0
      - ENVIRONMENT=production
    healthcheck:
      # Python en vez de curl: la imagen python:3.12-slim NO trae curl. Ruta
      # /health (NO /api/v1/health). start_period da margen a que corran las
      # migraciones del entrypoint + arranque de Uvicorn antes de contar fallos.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      portfolio-db:
        condition: service_healthy
      sentra-redis:
        condition: service_started
    networks:
      - proxy-net # Para que Traefik lo enrute desde afuera
      - internal-net # Para hablar con portfolio-db y sentra-redis
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.sentra-api.rule=Host(`api.cescjavier.dev`)"
      - "traefik.http.routers.sentra-api.entrypoints=websecure"
      # Mismo patrón que portfolio-app: sin certresolver, TLS lo resuelve Cloudflare.
      - "traefik.http.routers.sentra-api.tls=true"
      - "traefik.http.services.sentra-api.loadbalancer.server.port=8000"
      # NOTA: NO usamos un `serversTransport` propio. Traefik por defecto NO pone
      # límite al tiempo de respuesta del backend (responseHeaderTimeout=0), así
      # que la generación lenta con IA ya está cubierta. El timeout real se
      # maneja en Uvicorn (--timeout-keep-alive) y en el cliente (120s). Un
      # serversTransport@docker mal referenciado deja el servicio sin ruta →
      # 502/503 → login roto. No vale la pena el riesgo por un default que ya sirve.
      # Rate limiting también a nivel de proxy, como capa extra ante el
      # rate limiting propio de la app (defensa en profundidad).
      - "traefik.http.middlewares.sentra-api-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.sentra-api-ratelimit.ratelimit.burst=100"
      - "traefik.http.routers.sentra-api.middlewares=sentra-api-ratelimit"

networks:
  proxy-net:
    external: true
  internal-net:
    driver: bridge

volumes:
  postgres-data: