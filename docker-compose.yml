services:
  portfolio-app:
    build: .
    container_name: portfolio-frontend
    restart: always
    security_opt:
      - no-new-privileges:true
    # env_file carga TODAS las variables del archivo .env dentro del
    # contenedor en runtime (GROQ_API_KEY, y las de Postgres de abajo).
    # Este archivo vive SOLO en el VPS, nunca en el repo (mismo principio
    # que .env.local en tu Mac: secretos fuera de git).
    env_file:
      - .env
    environment:
      # Compose interpola ${...} leyendo el mismo .env automáticamente.
      # `portfolio-db` es resoluble por DNS interno de Docker gracias a
      # que ambos servicios comparten `internal-net`.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@portfolio-db:5432/${POSTGRES_DB}
      - NODE_ENV=production
    depends_on:
      portfolio-db:
        condition: service_healthy
    networks:
      - proxy-net # Para que Traefik lo enrute desde afuera
      - internal-net # Para hablar con Postgres, sin exponerlo a internet
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.portfolio.rule=Host(`cescjavier.dev`) || Host(`www.cescjavier.dev`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      # 🔴 Eliminamos certresolver y forzamos TLS básico para que Cloudflare haga el trabajo
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.services.portfolio.loadbalancer.server.port=3000"

  portfolio-db:
    image: postgres:16-alpine
    container_name: portfolio-db
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432" # <-- EL PARCHE ATÓMICO: Abre el puerto SOLO para tu Mac
    volumes:
      # Persistencia real: los datos sobreviven a `docker-compose down` y
      # a rebuilds del contenedor. Solo se pierden si borras el volumen
      # explícitamente (`docker volume rm`).
      - postgres-data:/var/lib/postgresql/data
    networks:
      # SIN proxy-net a propósito: Postgres nunca debe ser alcanzable
      # desde Traefik ni desde internet, solo desde portfolio-app.
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  proxy-net:
    external: true
  internal-net:
    driver: bridge

volumes:
  postgres-data: